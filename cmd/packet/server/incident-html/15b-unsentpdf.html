<!DOCTYPE html>
<html>

<head>
  <script> // Download Unsent Messages Dialog
    // upList fills the dialog with one checkbox per unsent message, showing
    // it the way the message log does: status, number, recipient, subject.
    function upList(messages) {
      const list = document.getElementById('uplist')
      list.innerHTML = ''
      messages.forEach(m => {
        const row = document.createElement('label')
        row.className = 'uprow'
        const box = document.createElement('input')
        box.type = 'checkbox'
        box.className = 'up-msg'
        box.value = m.ident
        box.checked = true
        box.addEventListener('change', upCount)
        row.appendChild(box)
        const cells = [
          ['upst ' + (m.status === 'READY' ? 'upready' : 'updraft'), m.status],
          ['upid', m.id],
          ['upto', m.to ? '\u2192 ' + m.to : ''],
          ['upsubj', m.subject],
        ]
        cells.forEach(([cls, text]) => {
          const span = document.createElement('span')
          span.className = cls
          span.textContent = text
          row.appendChild(span)
        })
        list.appendChild(row)
      })
      upCount()
    }
    function upBoxes() {
      return [...document.querySelectorAll('#uplist .up-msg')]
    }
    function upCount() {
      const boxes = upBoxes()
      const checked = boxes.filter(b => b.checked)
      document.getElementById('upcount').textContent =
        `${checked.length} of ${boxes.length} message(s) selected`
      document.getElementById('upsub').disabled = checked.length === 0
      const all = document.getElementById('upall')
      all.checked = boxes.length > 0 && checked.length === boxes.length
      all.indeterminate = checked.length > 0 && checked.length < boxes.length
    }
    function setupUnsentPDFsDialog() {
      document.getElementById('upall').addEventListener('change', evt => {
        upBoxes().forEach(b => { b.checked = evt.target.checked })
        upCount()
      })
      document.getElementById('upform').addEventListener('submit', async evt => {
        evt.preventDefault()
        const format = document.querySelector('#upform input[name=upformat]:checked').value
        const params = new URLSearchParams({
          dir: document.body.dataset.dir, format,
          hideOrigin: document.getElementById('uphideorig').checked ? '1' : '0',
          hideDest: document.getElementById('uphidedest').checked ? '1' : '0',
          annotate: document.getElementById('upannotate').checked ? '1' : '0',
        })
        upBoxes().filter(b => b.checked).forEach(b => params.append('id', b.value))
        const sub = document.getElementById('upsub')
        sub.disabled = true
        document.getElementById('upstatus').textContent = 'Creating the PDFs…'
        try {
          const resp = await fetch2('/unsent-pdfs?' + params.toString())
          if (!resp.ok) {
            document.getElementById('updlg').close()
            openErrorDialog('Download Unsent Messages', await resp.text())
            return
          }
          downloadBlob(await resp.blob(), format === 'pdf' ? 'unsent-messages.pdf' : 'unsent-messages.zip')
          document.getElementById('updlg').close()
        } finally {
          sub.disabled = false
          document.getElementById('upstatus').textContent = ''
        }
      })
      document.getElementById('upcan').addEventListener('click', () => {
        document.getElementById('updlg').close()
      })
    }
    async function openUnsentPDFsDialog() {
      document.getElementById('upstatus').textContent = ''
      document.getElementById('uplist').innerHTML = ''
      document.getElementById('upcount').textContent = 'Loading…'
      const params = new URLSearchParams({ dir: document.body.dataset.dir })
      const resp = await fetch2('/unsent-messages?' + params.toString())
      if (!resp.ok) {
        openErrorDialog('Download Unsent Messages', await resp.text())
        return
      }
      const messages = await resp.json()
      if (!messages.length) {
        openErrorDialog('Download Unsent Messages', 'There are no unsent messages to download.')
        return
      }
      upList(messages)
      document.getElementById('updlg').showModal()
    }
  </script>
  <style>
    #updlg {
      margin: 4rem auto;
      padding: 0 0.75rem 0.75rem;
      z-index: 2;
    }

    #updlg h1 {
      background-color: #a8e8a8;
      margin: 0 -0.75rem;
      padding: 0.5rem 0.75rem;
      font-size: 1.5rem;
    }

    #upform {
      max-width: 40rem;
      margin-top: 1rem;
    }

    #upform > label {
      display: block;
      margin-top: 0.5rem;
    }

    #uplist {
      margin-top: 0.5rem;
      max-height: 50vh;
      overflow-y: auto;
      border: 1px solid #ccc;
    }

    .uprow {
      display: grid;
      grid-template-columns: auto 3.5rem auto auto minmax(0, 1fr);
      gap: 0.5rem;
      align-items: baseline;
      padding: 0.15rem 0.35rem;
      border-bottom: 1px solid #eee;
      font-size: 0.9em;
    }

    .uprow:hover {
      background-color: #eef8ee;
    }

    .upst {
      font-size: 0.75em;
      font-weight: bold;
    }

    .updraft {
      color: #888;
    }

    .upready {
      color: #070;
    }

    .upid,
    .upto {
      white-space: nowrap;
    }

    .upsubj {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #uphiderow {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.25rem;
    }

    #uphiderow label {
      display: inline-block;
    }

    .uphint {
      color: #666;
      font-size: 0.85em;
    }

    #upcount {
      margin-top: 0.35rem;
      color: #666;
      font-size: 0.85em;
    }

    #upstatus {
      margin-top: 1rem;
      color: #666;
    }

    #upbuttons {
      margin-top: 1.5rem;
      display: flex;
      justify-content: end;
      gap: 0.75rem;
    }

    #upcan,
    #upsub {
      border-radius: 0.25rem;
    }

    #upsub {
      background-color: #a8e8a8;
    }
  </style>
</head>

<body>
  <dialog id=updlg>
    <h1>Download Unsent Messages</h1>
    <form id=upform>
      <div>Messages to download:</div>
      <div id=uplist></div>
      <p id=upcount></p>
      <label><input type=checkbox id=upall checked> Select all</label>
      <div>Hide message number:</div>
      <div id=uphiderow>
        <label><input type=checkbox id=uphideorig checked> Origin</label>
        <label><input type=checkbox id=uphidedest checked> Destination</label>
      </div>
      <label><input type=checkbox id=upannotate> Annotate prowords
        <span class=uphint>adds a page after each message naming the prowords its text calls for, with a bar every 5 groups</span></label>
      <div>Download as:</div>
      <label><input type=radio name=upformat value=pdf checked> One PDF with all the messages, one after another</label>
      <label><input type=radio name=upformat value=zip> A ZIP file with a separate PDF for each message</label>
      <div id=upstatus></div>
      <div id=upbuttons>
        <button id=upcan type=button>Cancel</button>
        <input id=upsub type=submit value="Download">
      </div>
    </form>
  </dialog>
</body>

</html>
