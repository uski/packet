<!DOCTYPE html>
<html>

<head>
  <script> // Generate Training Messages Dialog
    const gtMessageTypeData = '{{MTYPES}}'
    let gtMessageTypes = []
    function gtAddRow() {
      const tmpl = document.getElementById('gttypetmpl')
      const row = document.importNode(tmpl.content, true).firstElementChild
      const sel = row.querySelector('select')
      gtMessageTypes.forEach(mt => {
        const opt = document.createElement('option')
        opt.value = mt.tag
        opt.textContent = mt.name
        sel.appendChild(opt)
      })
      row.querySelector('.gtremove').addEventListener('click', () => {
        if (document.querySelectorAll('#gtrows .gtrow').length > 1) row.remove()
      })
      document.getElementById('gtrows').appendChild(row)
    }
    function gtShowResults(data) {
      const div = document.getElementById('gtresults')
      div.innerHTML = ''
      data.messages.forEach(msg => {
        const h = document.createElement('h2')
        h.textContent = `${msg.id} — ${msg.type}`
        div.appendChild(h)
        if (msg.missing && msg.missing.length) {
          const warn = document.createElement('p')
          warn.className = 'gtwarn'
          warn.textContent = `May be missing: ${msg.missing.join(', ')}. Review before use.`
          div.appendChild(warn)
        }
        if (msg.invalid && msg.invalid.length) {
          const warn = document.createElement('p')
          warn.className = 'gtwarn'
          warn.textContent = `Unrecognized value for: ${msg.invalid.join(', ')}; left at default. Review before use.`
          div.appendChild(warn)
        }
        if (msg.missingFields && msg.missingFields.length) {
          const warn = document.createElement('p')
          warn.className = 'gtwarn'
          warn.textContent = `Missing required field(s): ${msg.missingFields.join(', ')}. Review before use.`
          div.appendChild(warn)
        }
        if (!msg.prowords || !msg.prowords.length) {
          const none = document.createElement('p')
          none.textContent = '(no prowords detected)'
          div.appendChild(none)
          return
        }
        const table = document.createElement('table')
        table.className = 'gtptable'
        const thead = table.createTHead().insertRow()
        for (const label of ['Proword', 'Count']) {
          const th = document.createElement('th')
          th.textContent = label
          thead.appendChild(th)
        }
        const tbody = table.createTBody()
        msg.prowords.forEach(pw => {
          const row = tbody.insertRow()
          row.insertCell().textContent = pw.name
          row.insertCell().textContent = pw.count
        })
        div.appendChild(table)
      })
      document.getElementById('gtform').hidden = true
      document.getElementById('gtprogress').hidden = true
      div.hidden = false
      document.getElementById('gtsubrow').hidden = true
      document.getElementById('gtdonerow').hidden = false
    }
    function gtShowProgress(msg) {
      document.getElementById('gtform').hidden = true
      document.getElementById('gtresults').hidden = true
      document.getElementById('gtsubrow').hidden = true
      document.getElementById('gtdonerow').hidden = true
      const prog = document.getElementById('gtprogress')
      prog.hidden = false
      document.getElementById('gtprogmsg').textContent = msg
    }
    function gtShowError(msg) {
      document.getElementById('gtprogress').hidden = true
      document.getElementById('gtform').hidden = false
      document.getElementById('gtsubrow').hidden = false
      document.getElementById('gterr').textContent = msg
    }
    // gtPoll long-polls GET /gentrain-progress for dir, updating the
    // progress display as updates arrive, until the job is done (showing
    // the results or the error) or the poll itself fails (e.g. the server
    // restarted).
    async function gtPoll(dir, seq) {
      const params = new URLSearchParams({ dir, seq })
      let resp
      try {
        resp = await fetch2('/gentrain-progress?' + params.toString())
      } catch (e) {
        gtShowError('Lost contact with the server while generating: ' + e)
        return
      }
      if (resp.status === 410) {
        gtShowError('The generation job ended unexpectedly. Please try again.')
        return
      }
      if (!resp.ok) {
        gtShowError((await resp.text()) || resp.statusText)
        return
      }
      const update = await resp.json()
      if (update.done) {
        if (update.error) {
          gtShowError(update.error)
        } else {
          gtShowResults(update.result)
        }
        return
      }
      gtShowProgress(update.progress || 'Working…')
      gtPoll(dir, update.seq)
    }
    function setupGenTrainingDialog() {
      gtMessageTypeData.split(';').forEach(triplet => {
        const [tag, key, name] = triplet.split(':', 3)
        if (tag) gtMessageTypes.push({ tag, key, name })
      })
      document.getElementById('gtadd').addEventListener('click', () => gtAddRow())
      document.getElementById('gtcan').addEventListener('click', () => {
        document.getElementById('gtdlg').close()
      })
      document.getElementById('gtdone').addEventListener('click', () => {
        document.getElementById('gtdlg').close()
      })
      document.getElementById('gtform').addEventListener('submit', async evt => {
        evt.preventDefault()
        const dir = document.body.dataset.dir
        const data = new FormData(evt.target)
        const sub = document.getElementById('gtsub')
        sub.disabled = true
        try {
          const resp = await fetch2('/gentrain-messages', { method: 'POST', body: data })
          if (resp.status === 204) {
            gtShowProgress('Starting…')
            gtPoll(dir, 0)
            return
          }
          document.getElementById('gterr').textContent = (await resp.text()) || resp.statusText
        } catch (e) {
          document.getElementById('gterr').textContent = 'Request failed: ' + e
        } finally {
          sub.disabled = false
        }
      })
    }
    function openGenTrainingDialog() {
      document.getElementById('gterr').textContent = ''
      document.getElementById('gtscenario').value = ''
      document.getElementById('gtrows').innerHTML = ''
      gtAddRow()
      document.getElementById('gtform').hidden = false
      document.getElementById('gtprogress').hidden = true
      document.getElementById('gtresults').hidden = true
      document.getElementById('gtsubrow').hidden = false
      document.getElementById('gtdonerow').hidden = true
      document.getElementById('gtdlg').showModal()
    }
  </script>
  <style>
    #gtdlg {
      max-width: 34rem;
      margin: 4rem auto;
      padding: 0 0.75rem 0.75rem;
      z-index: 2;
    }

    #gtdlg h1 {
      background-color: #a8e8a8;
      margin: 0 -0.75rem;
      padding: 0.5rem 0.75rem;
      font-size: 1.5rem;
    }

    #gtform {
      display: flex;
      flex-direction: column;
    }

    .gtrow {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.35rem;
      align-items: center;
    }

    .gtrow select {
      flex: 1;
    }

    #gtadd {
      margin-top: 0.5rem;
      align-self: start;
    }

    #gtlevels {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    #gtscenario {
      margin-top: 0.5rem;
      width: 100%;
      box-sizing: border-box;
    }

    #gterr:not(:empty) {
      margin-top: 1.5rem;
      color: red;
    }

    #gtprogress {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem 0;
    }

    #gtspinner {
      width: 1.25rem;
      height: 1.25rem;
      flex: none;
      border: 0.2rem solid #ccc;
      border-top-color: #2a8;
      border-radius: 50%;
      animation: gtspin 0.8s linear infinite;
    }

    @keyframes gtspin {
      to {
        transform: rotate(360deg);
      }
    }

    #gtresults h2 {
      font-size: 1rem;
      margin: 1rem 0 0.25rem;
    }

    .gtwarn {
      color: #a15c00;
      margin: 0 0 0.25rem;
    }

    .gtptable {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .gtptable th,
    .gtptable td {
      border: 1px solid #ccc;
      padding: 0.15rem 0.5rem;
      text-align: left;
    }

    .gtptable td:last-child,
    .gtptable th:last-child {
      text-align: right;
    }

    #gtsubrow,
    #gtdonerow {
      margin-top: 1.5rem;
      display: flex;
      justify-content: end;
      gap: 0.75rem;
    }

    #gtcan,
    #gtsub,
    #gtdone {
      border-radius: 0.25rem;
    }

    #gtsub,
    #gtdone {
      background-color: #a8e8a8;
    }
  </style>
</head>

<body>
  <dialog id=gtdlg>
    <h1>Generate Training Messages</h1>
    <form id=gtform>
      <input type=hidden name=dir value="{{DIR}}">
      <p>Add one row per message to generate. A training session can mix message types.</p>
      <div id=gtrows></div>
      <template id=gttypetmpl>
        <div class=gtrow>
          <select name=msgtype required></select>
          <button type=button class=gtremove title="Remove this message">&times;</button>
        </div>
      </template>
      <button type=button id=gtadd>+ Add another message</button>
      <p>Proword level:</p>
      <div id=gtlevels>
        <label><input type=radio name=level value=full checked> Full list (F2/F1, all Net Control/Packet/Shadow tiers)</label>
        <label><input type=radio name=level value=f3> F3 reduced list</label>
      </div>
      <p>Scenario (optional):</p>
      <textarea id=gtscenario name=scenario rows=2 placeholder="e.g. a downed power line on Almaden Expressway (leave blank for a generic scenario)"></textarea>
      <div id=gterr></div>
      <div id=gtsubrow>
        <button id=gtcan type=button>Cancel</button>
        <input id=gtsub type=submit value="Generate Messages">
      </div>
    </form>
    <div id=gtprogress hidden>
      <div id=gtspinner></div>
      <p id=gtprogmsg></p>
    </div>
    <div id=gtresults hidden></div>
    <div id=gtdonerow hidden>
      <button id=gtdone type=button>Done</button>
    </div>
  </dialog>
</body>

</html>
